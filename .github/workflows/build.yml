name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FolderBackuper.slnx

      - name: Build
        run: dotnet build FolderBackuper.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FolderBackuper.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  package:
    # Builds setup.exe and keeps it as a workflow artifact. Publishing a GitHub release is a
    # separate, deliberate step and is not automated here.
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: pwsh -NoProfile -File installer/Build-Installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/installer/FolderBackuper-*-setup.exe
          if-no-files-found: error
